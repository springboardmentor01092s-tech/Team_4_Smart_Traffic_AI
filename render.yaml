# Render Blueprint Configuration (render.yaml)
# Docs: https://render.com/docs/blueprint-spec

services:
  # Backend FastAPI Web Service
  - type: web
    name: cityflowx-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PROJECT_NAME
        value: CityFlowX AI
      - key: API_V1_STR
        value: /api/v1
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      # Supabase PostgreSQL connection
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      - key: POSTGRES_HOST
        sync: false
      - key: POSTGRES_PORT
        value: "5432"
      - key: POSTGRES_DB
        value: "postgres"
      # MongoDB Atlas connection
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: "smarttraffic"
      # External Traffic APIs
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: TOMTOM_API_KEY
        sync: false
      - key: HERE_API_KEY
        sync: false

  # Frontend Next.js Web Service
  - type: web
    name: cityflowx-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    region: oregon
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_BASE_URL
        fromService:
          type: web
          name: cityflowx-backend
          property: host
        transform: "https://${value}/api/v1"
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
        sync: false
