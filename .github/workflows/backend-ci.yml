name: TrafficVision AI — Backend CI

on:
  push:
    branches:
      - Back-End-Authentication
      - main
  pull_request:
    branches:
      - Back-End-Authentication
      - main

jobs:
  test:
    name: Backend Test Suite & Code Quality
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trafficvision_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python syntax and imports
        run: |
          python -m compileall -q app alembic tests

      - name: Run Alembic migrations against PostgreSQL
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/trafficvision_test
          JWT_SECRET_KEY: ci_secret_key_for_testing_purposes_only_min_32_characters
        run: |
          alembic upgrade head

      - name: Execute Pytest test suite
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/trafficvision_test
          JWT_SECRET_KEY: ci_secret_key_for_testing_purposes_only_min_32_characters
          APP_ENV: development
        run: |
          pytest -v --durations=10

  docker:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: trafficvision-backend:ci-test
